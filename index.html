<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SWAG 內部訓練測驗</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>📝</text></svg>" />
<style>
  :root{
    --bg-0:#0a0e17;
    --bg-1:#0f1524;
    --glass:rgba(255,255,255,0.05);
    --glass-strong:rgba(255,255,255,0.08);
    --border:rgba(255,255,255,0.12);
    --border-strong:rgba(120,180,255,0.35);
    --text:#e7ecf5;
    --text-dim:#9aa6bd;
    --accent:#4f8cff;
    --accent-2:#7c5cff;
    --good:#31d0aa;
    --warn:#ffb347;
    --bad:#ff5d6c;
    --radius:16px;
    --shadow:0 12px 40px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100%;}
  body{
    font-family:"Noto Sans TC","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--text);
    background:var(--bg-0);
    min-height:100vh;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  /* 固定全螢幕背景層：不隨內容捲動，避免漸層邊界產生斷層 */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(79,140,255,0.16), transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, rgba(124,92,255,0.15), transparent 55%),
      linear-gradient(160deg,var(--bg-0),var(--bg-1));
  }
  .wrap{max-width:840px;margin:0 auto;padding:32px 20px 96px;}
  .screen{display:none;animation:fadeUp .4s ease both;}
  .screen.active{display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .card{
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:var(--shadow);
  }
  .card + .card{margin-top:18px;}

  h1{font-size:1.6rem;font-weight:800;letter-spacing:.5px;}
  h2{font-size:1.15rem;font-weight:700;}
  .sub{color:var(--text-dim);font-size:.92rem;margin-top:6px;}
  .brand{
    display:inline-flex;align-items:center;gap:10px;font-weight:800;
    letter-spacing:2px;font-size:.8rem;color:var(--text-dim);text-transform:uppercase;
    margin-bottom:18px;
  }
  .brand .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 14px var(--accent);}

  /* buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:1px solid var(--border);background:var(--glass-strong);color:var(--text);
    padding:12px 20px;border-radius:12px;font-size:.98rem;font-weight:600;cursor:pointer;
    transition:.18s ease;font-family:inherit;
  }
  .btn:hover{border-color:var(--border-strong);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;box-shadow:0 8px 24px rgba(79,140,255,.35);}
  .btn.ghost{background:transparent;}
  .btn.block{width:100%;}
  .btn.small{padding:8px 14px;font-size:.86rem;}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;}

  /* email gate */
  #gate{
    position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    padding:20px;
    background:
      radial-gradient(900px 600px at 20% 0%, rgba(79,140,255,0.18), transparent 60%),
      linear-gradient(160deg,var(--bg-0),var(--bg-1));
    transition:opacity .6s ease;
  }
  #gate .card{width:100%;max-width:440px;text-align:center;}
  .field{margin-top:20px;text-align:left;}
  .field label{display:block;font-size:.82rem;color:var(--text-dim);margin-bottom:8px;letter-spacing:.5px;}
  input[type=email],input[type=text],textarea{
    width:100%;background:rgba(0,0,0,.25);border:1px solid var(--border);
    color:var(--text);border-radius:12px;padding:13px 15px;font-size:1rem;font-family:inherit;
    transition:.18s;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.18);}
  textarea{min-height:110px;resize:vertical;line-height:1.6;}
  textarea.long{min-height:220px;}
  .hint{font-size:.82rem;color:var(--text-dim);margin-top:10px;text-align:left;}
  .gate-msg{min-height:20px;margin-top:12px;font-size:.9rem;color:var(--bad);text-align:left;}

  /* mode grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:20px;}
  .mode-card{
    text-align:left;cursor:pointer;border:1px solid var(--border);background:var(--glass-strong);
    border-radius:var(--radius);padding:22px;transition:.18s;position:relative;overflow:hidden;
  }
  .mode-card:hover{border-color:var(--border-strong);transform:translateY(-3px);box-shadow:var(--shadow);}
  .mode-card .tag{font-size:.72rem;letter-spacing:2px;color:var(--accent);font-weight:700;text-transform:uppercase;}
  .mode-card .name{font-size:1.15rem;font-weight:700;margin-top:8px;}
  .mode-card .meta{color:var(--text-dim);font-size:.85rem;margin-top:10px;}
  .mode-card.done{filter:grayscale(.85);opacity:.55;}
  .mode-card.done:hover{opacity:.8;transform:translateY(-2px);}
  .mode-card.locked{filter:grayscale(1);opacity:.45;cursor:not-allowed;}
  .mode-card.locked:hover{transform:none;border-color:var(--border);box-shadow:none;}
  .mode-card .lock-badge{
    position:absolute;top:12px;right:12px;font-size:.7rem;font-weight:700;letter-spacing:.5px;
    color:var(--warn);background:rgba(255,179,71,.14);border:1px solid rgba(255,179,71,.4);
    padding:3px 9px;border-radius:999px;}
  .mode-card .done-badge{
    position:absolute;top:12px;right:12px;font-size:.7rem;font-weight:700;letter-spacing:.5px;
    color:var(--good);background:rgba(49,208,170,.14);border:1px solid rgba(49,208,170,.4);
    padding:3px 9px;border-radius:999px;
  }

  /* quiz */
  .q-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .q-card{scroll-margin-top:90px;}
  .q-num{font-weight:800;color:var(--accent);font-size:.9rem;letter-spacing:1px;}
  .q-type{font-size:.72rem;color:var(--text-dim);border:1px solid var(--border);padding:3px 10px;border-radius:999px;}
  .q-text{margin-top:12px;font-size:1.02rem;font-weight:500;white-space:pre-wrap;}
  .q-link{display:inline-block;margin-top:10px;color:var(--accent);font-size:.9rem;text-decoration:none;
    border:1px solid var(--border);border-radius:8px;padding:6px 12px;transition:.15s;word-break:break-all;}
  .q-link:hover{border-color:var(--accent);background:rgba(79,140,255,.1);}
  .btn.danger{border-color:rgba(255,93,108,.4);color:var(--bad);}
  .btn.danger:hover{border-color:var(--bad);background:rgba(255,93,108,.12);}
  .btn.graded{border-color:rgba(49,208,170,.5);color:var(--good);background:rgba(49,208,170,.1);}
  .btn.graded:hover{border-color:var(--good);background:rgba(49,208,170,.18);}
  #grade-capture{background:var(--bg-1);border-radius:12px;padding:4px;}
  .options{margin-top:16px;display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;align-items:flex-start;gap:12px;cursor:pointer;
    border:1px solid var(--border);background:rgba(0,0,0,.18);border-radius:12px;padding:13px 15px;transition:.15s;
  }
  .opt:hover{border-color:var(--border-strong);}
  .opt input{margin-top:4px;accent-color:var(--accent);width:17px;height:17px;flex:none;}
  .opt.checked{border-color:var(--accent);background:rgba(79,140,255,.12);}
  .opt .letter{font-weight:700;color:var(--accent);flex:none;}
  .q-card.flash{animation:flash 1.1s ease;}
  @keyframes flash{
    0%{box-shadow:0 0 0 0 rgba(255,93,108,.0);border-color:var(--border);}
    20%{box-shadow:0 0 0 3px rgba(255,93,108,.45);border-color:var(--bad);}
    100%{box-shadow:0 0 0 0 rgba(255,93,108,0);border-color:var(--border);}
  }

  /* floating timer */
  #timer{
    position:fixed;top:16px;right:16px;z-index:40;display:none;align-items:center;gap:10px;
    background:rgba(15,21,36,.82);border:1px solid var(--border-strong);border-radius:999px;
    padding:10px 18px;backdrop-filter:blur(10px);box-shadow:var(--shadow);font-variant-numeric:tabular-nums;
  }
  #timer .pulse{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 12px var(--good);animation:pulse 1.4s infinite;}
  #timer.paused .pulse{background:var(--warn);box-shadow:0 0 12px var(--warn);animation:none;}
  #timer .t{font-weight:800;font-size:1.05rem;letter-spacing:1px;}
  #timer .lbl{font-size:.7rem;color:var(--text-dim);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  /* 計時器旁的提醒（8/10 分鐘） */
  #timer-alert{
    position:fixed;top:64px;right:16px;z-index:41;display:none;max-width:240px;
    background:rgba(255,93,108,.95);color:#fff;border-radius:12px;padding:10px 14px;
    font-size:.85rem;font-weight:700;box-shadow:0 8px 24px rgba(255,93,108,.5);
    animation:alertflash 1s ease-in-out infinite;
  }
  @keyframes alertflash{0%,100%{transform:scale(1);box-shadow:0 8px 24px rgba(255,93,108,.5);}50%{transform:scale(1.04);box-shadow:0 10px 30px rgba(255,93,108,.8);}}

  /* 劇透遮罩：題目點擊才顯示 */
  .q-veil{
    margin-top:12px;border:1px dashed var(--border-strong);border-radius:12px;
    padding:26px 16px;text-align:center;cursor:pointer;color:var(--text-dim);
    background:rgba(79,140,255,.06);transition:.15s;font-weight:600;user-select:none;
  }
  .q-veil:hover{background:rgba(79,140,255,.12);border-color:var(--accent);color:var(--text);}
  .q-veil .eye{font-size:1.4rem;display:block;margin-bottom:4px;}
  .q-body{display:none;}
  .q-card.revealed .q-body{display:block;}
  .q-card.revealed .q-veil{display:none;}

  /* review */
  .rv-item{border:1px solid var(--border);background:rgba(0,0,0,.15);border-radius:12px;padding:16px;margin-top:12px;}
  .rv-item .rv-q{font-weight:600;}
  .rv-item .rv-a{margin-top:8px;color:var(--good);white-space:pre-wrap;background:rgba(49,208,170,.08);border-left:3px solid var(--good);padding:8px 12px;border-radius:6px;}
  .rv-item.empty .rv-a{color:var(--warn);background:rgba(255,179,71,.08);border-left-color:var(--warn);}

  /* success */
  .ok-icon{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--good),var(--accent));font-size:2rem;box-shadow:0 8px 24px rgba(49,208,170,.4);}

  /* reviewer */
  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:.88rem;}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);}
  th{color:var(--text-dim);font-weight:600;font-size:.78rem;letter-spacing:.5px;}
  tr:hover td{background:rgba(255,255,255,.03);}
  .score-pill{display:inline-block;min-width:34px;text-align:center;padding:2px 8px;border-radius:999px;font-weight:700;font-size:.8rem;
    background:rgba(124,92,255,.18);color:#c9bcff;border:1px solid rgba(124,92,255,.4);}
  .score-pill.empty{background:rgba(255,179,71,.14);color:var(--warn);border-color:rgba(255,179,71,.4);}
  .loading{color:var(--text-dim);text-align:center;padding:24px;}
  .status{font-size:.9rem;margin-top:12px;min-height:20px;}
  .status.ok{color:var(--good);}
  .status.err{color:var(--bad);}
  .table-scroll{overflow-x:auto;}

  /* reviewer filters */
  .rev-filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px;}
  .rev-filters select{background:rgba(0,0,0,.25);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:9px 12px;font-family:inherit;font-size:.9rem;cursor:pointer;}
  .rev-filters select:focus{outline:none;border-color:var(--accent);}
  .rev-filters .chk{display:inline-flex;align-items:center;gap:7px;color:var(--text-dim);font-size:.9rem;cursor:pointer;}
  .rev-filters .chk input{accent-color:var(--accent);width:16px;height:16px;}
  .rev-filters .rev-count{color:var(--text-dim);font-size:.85rem;margin-left:auto;}

  /* 開放時間設定 */
  .sched-box{border:1px solid var(--border);border-radius:12px;margin-top:6px;background:rgba(0,0,0,.12);overflow:hidden;}
  .sched-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:transparent;border:none;color:var(--text);font-family:inherit;font-size:.95rem;font-weight:700;
    padding:14px 16px;cursor:pointer;text-align:left;}
  .sched-head:hover{background:rgba(255,255,255,.03);}
  .sched-caret{color:var(--text-dim);font-size:.8rem;}
  .sched-body{padding:0 16px 16px;}
  .sched-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--border);}
  .sched-row:first-of-type{border-top:none;}
  .sched-row .sname{flex:1 1 180px;font-weight:600;font-size:.9rem;}
  .sched-row label{color:var(--text-dim);font-size:.82rem;display:inline-flex;align-items:center;gap:6px;}
  .sched-row input[type=date]{background:rgba(0,0,0,.25);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:7px 10px;font-family:inherit;font-size:.85rem;}
  .sched-row input[type=date]:focus{outline:none;border-color:var(--accent);}
  .sched-row input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.65);cursor:pointer;}

  /* grade panel */
  .grade-q{border:1px solid var(--border);background:rgba(0,0,0,.15);border-radius:12px;padding:16px;margin-top:12px;}
  .grade-q .rv-q{font-weight:600;}
  .grade-q .stu-a{margin-top:8px;color:var(--text-dim);white-space:pre-wrap;background:rgba(255,255,255,.03);
    border-left:3px solid var(--border-strong);padding:8px 12px;border-radius:6px;font-size:.9rem;}
  .grade-q .stu-a.empty{color:var(--warn);border-left-color:var(--warn);}
  .grade-q .ref-a{margin-top:8px;color:#8fb8ff;background:rgba(79,140,255,.1);
    border-left:3px solid var(--accent);padding:8px 12px;border-radius:6px;font-size:.88rem;white-space:pre-wrap;}
  .grade-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;}
  .mark-toggle{display:flex;gap:8px;}
  .mark{border:2px solid var(--border);background:rgba(0,0,0,.2);color:var(--text-dim);border-radius:10px;
    padding:7px 14px;cursor:pointer;font-weight:700;font-size:.9rem;font-family:inherit;transition:.15s;}
  .mark:hover{border-color:var(--border-strong);}
  .mark.ok.active{background:rgba(49,208,170,.16);color:var(--good);border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset;}
  .mark.half.active{background:rgba(255,179,71,.16);color:var(--warn);border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset;}
  .mark.no.active{background:rgba(255,93,108,.14);color:var(--bad);border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset;}
  .pts{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:.9rem;}
  .pts input{width:74px;padding:8px 10px;text-align:center;background:rgba(0,0,0,.25);
    border:1px solid var(--border);color:var(--text);border-radius:10px;font-family:inherit;font-size:.95rem;}
  .pts input:focus{outline:none;border-color:var(--accent);}
  .q-comment{margin-top:10px;padding:9px 12px;font-size:.9rem;}
  .grade-total-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px;
    background:linear-gradient(135deg,rgba(79,140,255,.14),rgba(124,92,255,.14));
    border:1px solid var(--border-strong);border-radius:14px;padding:16px 20px;}
  .grade-total-bar .gt-label{font-weight:700;letter-spacing:1px;}
  .grade-total-bar .gt-value{font-size:1.6rem;font-weight:800;color:#fff;}
  .grade-total-bar .gt-unit{font-size:1rem;font-weight:600;color:var(--text-dim);}
  .grade-total-bar .sub{margin-left:8px;font-size:.85rem;}

  @media (max-width:520px){
    .wrap{padding:20px 14px 90px;}
    #timer{top:12px;right:12px;padding:8px 14px;}
    .card{padding:18px;}
  }
</style>
</head>
<body>

<!-- ============ 信箱驗證閘門 ============ -->
<div id="gate">
  <div class="card">
    <div class="brand"><span class="dot"></span>SWAG · Internal Training</div>
    <h1>基礎身分驗證</h1>
    <p class="sub">請輸入您的公司 Email 以開始測驗</p>
    <div class="field">
      <label>公司 Email</label>
      <input type="email" id="gate-email" placeholder="fin.chang@swag.live" autocomplete="email" />
      <div class="gate-msg" id="gate-msg"></div>
    </div>
    <button class="btn primary block" id="gate-btn" style="margin-top:8px;">進入測驗</button>
    <div class="hint">※ 僅接受符合公司格式的 <b>@swag.live</b> 帳號。</div>
  </div>
</div>

<!-- ============ 懸浮計時器 ============ -->
<div id="timer">
  <span class="pulse"></span>
  <div>
    <div class="lbl">作答計時</div>
    <div class="t" id="timer-display">00:00</div>
  </div>
</div>
<div id="timer-alert"></div>

<div class="wrap">

  <!-- ============ 模式選擇 ============ -->
  <section class="screen" id="screen-modes">
    <div class="brand"><span class="dot"></span>SWAG · Internal Training</div>
    <h1>選擇測驗模式</h1>
    <p class="sub">目前登入:<span id="who"></span></p>
    <div class="grid" id="mode-grid"></div>
    <div class="btn-row" id="reviewer-entry" style="display:none;">
      <button class="btn ghost" id="btn-reviewer">🔑 審核者模式</button>
    </div>
  </section>

  <!-- ============ 作答 ============ -->
  <section class="screen" id="screen-quiz">
    <div class="card">
      <div class="q-head">
        <div>
          <div class="q-num" id="quiz-tag"></div>
          <h2 id="quiz-title"></h2>
        </div>
        <button class="btn ghost small" id="btn-back-modes">← 返回模式</button>
      </div>
    </div>
    <div id="quiz-questions"></div>
    <div class="card">
      <button class="btn primary block" id="btn-submit">送出試卷</button>
    </div>
  </section>

  <!-- ============ 檢查頁(唯讀) ============ -->
  <section class="screen" id="screen-review">
    <div class="card">
      <h1>請檢查作答內容</h1>
      <p class="sub">以下為您填寫的答案，請核對內容，確認後點擊送出試卷或上一頁編輯作答內容</p>
      <div id="review-list"></div>
      <div class="btn-row">
        <button class="btn ghost" id="btn-edit">← 上一頁</button>
        <button class="btn primary" id="btn-confirm">送出試卷</button>
      </div>
      <div class="status" id="submit-status"></div>
    </div>
  </section>

  <!-- ============ 完成 ============ -->
  <section class="screen" id="screen-done">
    <div class="card" style="text-align:center;">
      <div class="ok-icon">✓</div>
      <h1>作答已送出</h1>
      <p class="sub" id="done-summary"></p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn ghost" id="btn-home">回模式選擇</button>
      </div>
    </div>
  </section>

  <!-- ============ 審核者 ============ -->
  <section class="screen" id="screen-reviewer">
    <!-- 清單 -->
    <div class="card" id="rev-main">
      <div class="q-head">
        <div><div class="q-num">REVIEWER</div><h2>審核者模式 · 事後批改</h2></div>
        <div style="display:flex;gap:10px;">
          <button class="btn ghost small" id="btn-refresh">↻ 重新整理</button>
          <button class="btn ghost small" id="btn-rev-back">← 返回</button>
        </div>
      </div>

      <!-- 開放時間設定（可收合） -->
      <div class="sched-box">
        <button class="sched-head" id="sched-toggle" type="button">
          <span>各模式開放作答時間</span>
          <span class="sched-caret" id="sched-caret">▸</span>
        </button>
        <div class="sched-body" id="sched-body" style="display:none;">
          <p class="sub" style="margin:0 0 8px;">設定開放起始日；留白＝不限制。選好日期會自動儲存,展開後會保持展開,直到按「收合」為止。</p>
          <div id="sched-list"></div>
          <div class="btn-row" style="margin-top:12px;">
            <button class="btn small ghost" id="btn-sched-close" type="button">收合</button>
            <span class="status" id="sched-status" style="margin:0;align-self:center;"></span>
          </div>
        </div>
      </div>

      <div class="rev-filters">
        <select id="filter-mode"><option value="">全部模式</option></select>
        <select id="filter-email"><option value="">全部 Email</option></select>
        <select id="filter-sort">
          <option value="newest">最近提交</option>
          <option value="oldest">最早提交</option>
        </select>
        <label class="chk"><input type="checkbox" id="filter-ungraded" /> 只看未評分</label>
        <span class="rev-count" id="rev-count"></span>
      </div>
      <div class="table-scroll">
        <table id="rev-table">
          <thead>
            <tr><th>序</th><th>Email</th><th>作答時間</th><th>模式</th><th>耗時</th><th>評分</th><th></th></tr>
          </thead>
          <tbody id="rev-body"><tr><td colspan="7" class="loading">載入中…</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- 批改單筆 -->
    <div class="card" id="grade-panel" style="display:none;">
      <div id="grade-capture">
        <div class="q-head">
          <div>
            <h2 id="grade-title">批改</h2>
            <p class="sub" id="grade-sub"></p>
          </div>
          <button class="btn ghost small" id="btn-grade-close">關閉</button>
        </div>
        <div id="grade-detail"></div>
        <div class="grade-total-bar">
          <div class="gt-label">試卷得分</div>
          <div class="gt-value"><span id="grade-total">0</span><span class="gt-unit"> 分</span>
            <span class="sub" id="grade-maxnote"></span></div>
        </div>
      </div>
      <div class="btn-row" id="grade-actions">
        <button class="btn primary" id="btn-grade-save">儲存得分</button>
        <button class="btn ghost" id="btn-grade-shot">📋 複製批改截圖</button>
      </div>
      <div class="status" id="grade-status"></div>
    </div>
  </section>

</div>

<script>
/* ==========================================================================
   1) 設定：部署後把這裡換成你的 GAS Web App 網址
   ========================================================================== */
const GAS_URL = "https://script.google.com/macros/s/AKfycbwoz4HHhlN1p86hoAjfYd5Pcx6i4Kk6Hz7JfpwXnk8_RkmFmVin19Dp1Hf2c7mwFZmZ/exec";
const REVIEWER_EMAIL = "fin.chang@swag.live"; // 具審核者權限的帳號

/* ==========================================================================
   2) 題庫：前端只放「題目/選項」，不含任何答案（答案由 GAS 伺服器端保管）
      type: "single"(單選) | "multiple"(複選) | "short"(簡答)
      注意：新增或調整題目時，GAS 的 ANSWER_KEYS 需同步對應（同順序）
   ========================================================================== */
let QUIZZES = {};   // 題目改由 GAS 的 action=getQuiz 動態載入（題庫在 Google Sheet 維護）

/* ==========================================================================
   3) 信箱驗證規則
   ========================================================================== */
const WHITELIST = ["sam","bogi","lynn","pot","amy","bill.h","abby","maimai","suyu.c"];
const REGULAR_RE = /^[a-z]{2,}\.[a-z]{2,}$/;

function validateEmail(raw){
  const email = String(raw).trim().toLowerCase();
  const m = email.match(/^([^@]+)@swag\.live$/);
  if(!m) return { ok:false, msg:"請填寫正確的公司信箱(需為 @swag.live)。" };
  const local = m[1];
  if(WHITELIST.includes(local)) return { ok:true, email };
  if(REGULAR_RE.test(local)) return { ok:true, email };
  return { ok:false, msg:"信箱格式不符,請填寫公司信箱(格式:英文名.姓氏拼音@swag.live)。" };
}

/* ==========================================================================
   4) 全域狀態
   ========================================================================== */
let currentEmail = "";
let currentMode = null;      // quiz key
let answerStartISO = "";     // 首次作答時間（B 欄）
let completedTitles = new Set(); // 該使用者已完成的模式（以 title 判定）
let schedule = {};           // 各模式開放時間 { title:{start,end} }
let lastSubmit = {};         // 各模式最後送出時間戳(ms)，供 8 小時鎖定
let peekTitles = new Set();  // 因偷看而鎖定的模式
const LOCK_MS  = 8 * 60 * 60 * 1000;  // 送出後鎖定 8 小時
const LIMIT_MS = 10 * 60 * 1000;      // 作答上限 10 分鐘
const WARN1_MS = 8  * 60 * 1000;      // 8 分鐘提醒
let warned8 = false, warned10 = false, forceSubmitted = false;
const IDLE_MS = 150 * 1000;           // 閒置上限 2 分 30 秒（無簡答/詳答輸入）
let idleHandle = null;                // 閒置倒數 timer
// 計時器（累計制：回上一頁編輯會續計）
let timerRunning = false, timerStarted = false, runStart = 0, elapsedMs = 0, tickHandle = null;

/* ==========================================================================
   5) 畫面切換
   ========================================================================== */
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ==========================================================================
   6) 信箱閘門
   ========================================================================== */
const gateEmail = document.getElementById("gate-email");
const gateMsg = document.getElementById("gate-msg");
document.getElementById("gate-btn").addEventListener("click", passGate);
gateEmail.addEventListener("keydown", e=>{ if(e.key==="Enter") passGate(); });

function passGate(){
  const res = validateEmail(gateEmail.value);
  if(!res.ok){ gateMsg.textContent = res.msg; return; }
  gateMsg.textContent = "";
  currentEmail = res.email;
  const gate = document.getElementById("gate");
  gate.style.opacity = "0";
  setTimeout(()=>{ gate.style.display="none"; enterApp(); }, 600);
}

function enterApp(){
  document.getElementById("who").textContent = currentEmail;
  if(currentEmail === REVIEWER_EMAIL){
    document.getElementById("reviewer-entry").style.display = "flex";
  }
  showScreen("screen-modes");
  loadQuiz();                     // 向 GAS 即時抓題目，載回後渲染模式
  fetchSchedule();                // 查各模式開放時間
}

/* 向 GAS 取得題庫（不含答案），組成 QUIZZES */
function loadQuiz(){
  const grid = document.getElementById("mode-grid");
  grid.innerHTML = '<div class="loading">題目載入中…</div>';
  jsonp({ action:"getQuiz" }).then(res=>{
    if(res && res.ok){
      QUIZZES = {};
      (res.modes || []).forEach(m=>{
        QUIZZES[m.key] = { tag:m.tag, title:m.title, questions:m.questions };
      });
      renderModeGrid();
      fetchCompletedStatus();     // 模式載回後再查已完成狀態
    } else {
      grid.innerHTML = '<div class="loading" style="color:var(--bad)">題目載入失敗:'+escapeHtml((res&&res.error)||"未知")+'</div>';
    }
  }).catch(err=>{
    grid.innerHTML = '<div class="loading" style="color:var(--bad)">題目載入失敗:'+escapeHtml(err.message)+'（請重新整理）</div>';
  });
}

function fetchCompletedStatus(){
  jsonp({ action:"status", email: currentEmail }).then(res=>{
    if(res && res.ok){
      if(Array.isArray(res.completed)) completedTitles = new Set(res.completed);
      lastSubmit = res.lastSubmit || {};
      const pk = res.peek || {};
      peekTitles = new Set(Object.keys(pk).filter(t=>pk[t]));
      renderModeGrid();
    }
  }).catch(()=>{ /* 查詢失敗就維持全部可作答，不打斷使用者 */ });
}

/* 8 小時作答冷卻判斷 */
function lockState(title){
  const ms = Number(lastSubmit[title] || 0);
  if(!ms) return { locked:false };
  const elapsed = Date.now() - ms;
  if(elapsed < LOCK_MS){
    return { locked:true, until:new Date(ms + LOCK_MS) };
  }
  return { locked:false };
}
function fmtClock(d){
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function fetchSchedule(){
  jsonp({ action:"config" }).then(res=>{
    if(res && res.ok && res.schedule){
      schedule = res.schedule || {};
      renderModeGrid();
      if(typeof renderSchedEditor === "function") renderSchedEditor();
    }
  }).catch(()=>{ /* 取不到排程就視為全部開放 */ });
}

/* 判斷某模式目前是否開放；回傳 {open, reason} */
function modeOpenState(title){
  const s = schedule[title];
  if(!s || !s.start) return { open:true };
  const now = new Date();
  const st = new Date(s.start + "T00:00:00");
  if(now < st) return { open:false, reason:`${s.start} 起開放` };
  return { open:true };
}

/* ==========================================================================
   7) 模式選擇
   ========================================================================== */
function renderModeGrid(){
  const grid = document.getElementById("mode-grid");
  grid.innerHTML = "";
  const keys = Object.keys(QUIZZES);
  if(keys.length === 0){
    grid.innerHTML = '<div class="loading">目前沒有可作答的模式（請確認題庫的「啟用」欄為 🟢，或稍後重新整理）</div>';
    return;
  }
  keys.forEach(key=>{
    const q = QUIZZES[key];
    const done = completedTitles.has(q.title);
    const st = modeOpenState(q.title);
    const lk = lockState(q.title);
    const el = document.createElement("div");

    if(!st.open){
      el.className = "mode-card locked";
      el.innerHTML = `
        <span class="lock-badge">🔒 ${st.reason}</span>
        <div class="tag">${q.tag}</div>
        <div class="name">${q.title}</div>
        <div class="meta">共 ${q.questions.length} 題 · 尚未開放</div>`;
      grid.appendChild(el);
      return;
    }

    if(lk.locked){
      const isPeek = peekTitles.has(q.title);
      el.className = "mode-card locked";
      el.innerHTML = `
        <span class="lock-badge">🔒 ${isPeek ? '已鎖定' : '作答冷卻中'}</span>
        <div class="tag">${q.tag}</div>
        <div class="name">${q.title}</div>
        <div class="meta">${isPeek
          ? '先複習吸收,準備好再來作答 🌱 有問題找 FIN'
          : '已送出，需 8 小時後才能再作答<br>可於 ' + fmtClock(lk.until) + ' 後重試（或通知審核者刪除紀錄）'}</div>`;
      grid.appendChild(el);
      return;
    }

    el.className = "mode-card" + (done ? " done" : "");
    el.innerHTML = `
      ${done ? '<span class="done-badge">✓ 已完成</span>' : ''}
      <div class="tag">${q.tag}</div>
      <div class="name">${q.title}</div>
      <div class="meta">共 ${q.questions.length} 題 · ${done ? '你已作答過' : '點擊開始'}</div>`;
    el.addEventListener("click", ()=>{
      if(done && !confirm("你已完成過此測驗,要再作答一次嗎?(將新增一筆紀錄)")) return;
      startQuiz(key);
    });
    grid.appendChild(el);
  });
}
document.getElementById("btn-back-modes").addEventListener("click", ()=>{
  const quiz = QUIZZES[currentMode];
  // 偷看偵測：全部點開卻無有效作答（審核者豁免）
  if(currentEmail !== REVIEWER_EMAIL && quiz){
    const ev = evaluateQuizAttempt();
    if(ev.allRevealed && !ev.anyAnswered){ triggerPeekLock(quiz); return; }
  }
  if(timerStarted && !confirm("返回模式選擇將清除目前作答,確定?")) return;
  resetTimer();
  renderModeGrid();
  showScreen("screen-modes");
});

/* 評估本次作答：是否全部題目已點開、是否有任一題「有效作答」
   有效作答＝單/複選有選；簡答/詳答輸入 ≥ 5 字元 */
function evaluateQuizAttempt(){
  const quiz = QUIZZES[currentMode];
  if(!quiz) return { allRevealed:false, anyAnswered:true };
  let allRevealed = true, anyAnswered = false;
  quiz.questions.forEach(q=>{
    const card = document.getElementById("card-"+q.id);
    if(!card || !card.classList.contains("revealed")) allRevealed = false;
    const a = readAnswer(q);
    if(q.type === "single" || q.type === "multiple"){
      if(a.filled) anyAnswered = true;
    } else {
      if(a.display && a.display.trim().length >= 5) anyAnswered = true;
    }
  });
  return { allRevealed, anyAnswered };
}

/* 觸發偷看鎖定：送 peek 到後端、本地立即鎖定該模式、提示、回模式頁 */
function triggerPeekLock(quiz){
  const durationText = fmtDuration(currentElapsedMs());
  const dateText = new Date().toLocaleString("zh-TW",{timeZone:"Asia/Taipei",hour12:false});
  jsonp({ action:"peek", email:currentEmail, mode:quiz.title, datetime:dateText,
          opened:String(quiz.questions.length), duration:durationText })
    .then(res=>{ if(res && res.submitMs) lastSubmit[quiz.title] = res.submitMs; renderModeGrid(); })
    .catch(()=>{});
  lastSubmit[quiz.title] = Date.now();   // 本地立即鎖定
  peekTitles.add(quiz.title);
  alert("先別急著看完所有題目喔 👀 建議先把內容吸收理解,再回來好好作答。");
  resetTimer();
  renderModeGrid();
  showScreen("screen-modes");
}

/* ==========================================================================
   8) 開始作答 + 渲染題目
   ========================================================================== */
function startQuiz(key){
  currentMode = key;
  const quiz = QUIZZES[key];
  document.getElementById("quiz-tag").textContent = quiz.tag;
  document.getElementById("quiz-title").textContent = quiz.title;

  const box = document.getElementById("quiz-questions");
  box.innerHTML = "";
  const typeLabel = {single:"單選題", multiple:"複選題", short:"簡答題", long:"詳答題"};

  quiz.questions.forEach((q, i)=>{
    const card = document.createElement("div");
    card.className = "card q-card";
    card.id = "card-" + q.id;

    let body = `
      <div class="q-text">${escapeHtml(q.text)}</div>
      ${q.link ? `<a class="q-link" href="${escapeHtml(q.link)}" target="_blank" rel="noopener">🔗 參考網址：${escapeHtml(q.link)}</a>` : ""}`;

    if(q.type === "single" || q.type === "multiple"){
      const inputType = q.type === "single" ? "radio" : "checkbox";
      body += `<div class="options">`;
      q.options.forEach((opt, oi)=>{
        const letter = String.fromCharCode(65+oi);
        body += `
          <label class="opt">
            <input type="${inputType}" name="${q.id}" value="${letter}" data-text="${escapeHtml(opt)}" />
            <span class="letter">${letter}.</span>
            <span>${escapeHtml(opt)}</span>
          </label>`;
      });
      body += `</div>`;
    } else if(q.type === "short"){
      body += `<div style="margin-top:16px;"><textarea name="${q.id}" placeholder="請於此作答…"></textarea></div>`;
    } else if(q.type === "long"){
      body += `<div style="margin-top:16px;"><textarea class="long" name="${q.id}" placeholder="請於此詳細作答…"></textarea></div>`;
    }

    card.innerHTML = `
      <div class="q-head">
        <span class="q-num">Q${i+1}</span>
        <span class="q-type">${typeLabel[q.type]||q.type}</span>
      </div>
      <div class="q-veil"><span class="eye">👁️</span>點擊顯示第 ${i+1} 題</div>
      <div class="q-body">${body}</div>`;
    box.appendChild(card);

    // 點劇透遮罩 → 只顯示這一題，啟動全域計時（首次）與閒置倒數
    card.querySelector(".q-veil").addEventListener("click", ()=>{
      card.classList.add("revealed");
      startTimerOnce();
      startIdleWatch();          // 首次點開題目 → 開始閒置倒數
    });
  });

  // 選項高亮；簡答/詳答輸入才重置閒置倒數（選答案、點開題目不重置）
  box.querySelectorAll("input, textarea").forEach(el=>{
    el.addEventListener("input", ()=>{
      syncOptionHighlight();
      if(el.tagName === "TEXTAREA") resetIdleWatch();   // 只有簡答/詳答輸入重置
    });
    el.addEventListener("change", syncOptionHighlight);
  });

  // 重設本次作答狀態
  warned8 = false; warned10 = false; forceSubmitted = false;
  document.getElementById("timer-alert").style.display = "none";
  clearTimeout(idleHandle);
  resetTimer();
  showScreen("screen-quiz");
}

/* 閒置監看：點開任一題後開始；只有簡答/詳答輸入會重置；2:30 無輸入 → 自動退出。
   若本模式沒有任何簡答/詳答題（全選擇題），不啟用（避免誤退）。 */
function hasTextQuestion(){
  const quiz = QUIZZES[currentMode];
  return !!(quiz && quiz.questions.some(q => q.type === "short" || q.type === "long"));
}
function startIdleWatch(){
  if(!hasTextQuestion()) return;
  resetIdleWatch();
}
function resetIdleWatch(){
  if(!hasTextQuestion()) return;
  clearTimeout(idleHandle);
  idleHandle = setTimeout(idleExit, IDLE_MS);
}
function idleExit(){
  if(!document.getElementById("screen-quiz").classList.contains("active")) return;
  clearTimeout(idleHandle);
  resetTimer();
  renderModeGrid();
  showScreen("screen-modes");
  alert("休息一下沒關係 🌱 這次先退出囉。\n不知道怎麼寫嗎?先回去複習、消化一下,準備好再回來作答。");
}

function syncOptionHighlight(){
  document.querySelectorAll("#quiz-questions .opt").forEach(l=>{
    const input = l.querySelector("input");
    l.classList.toggle("checked", input.checked);
  });
}

/* ==========================================================================
   9) 計時器（首次輸入啟動、累計制）
   ========================================================================== */
function startTimerOnce(){
  if(timerStarted) return;
  timerStarted = true;
  answerStartISO = new Date().toISOString();
  document.getElementById("timer").style.display = "flex";
  resumeTimer();
}
function resumeTimer(){
  if(timerRunning) return;
  timerRunning = true;
  runStart = Date.now();
  document.getElementById("timer").classList.remove("paused");
  tickHandle = setInterval(updateTimerDisplay, 250);
  updateTimerDisplay();
}
function pauseTimer(){
  if(!timerRunning) return;
  elapsedMs += Date.now() - runStart;
  timerRunning = false;
  clearInterval(tickHandle);
  document.getElementById("timer").classList.add("paused");
  updateTimerDisplay();
}
function resetTimer(){
  timerRunning = false; timerStarted = false; runStart = 0; elapsedMs = 0;
  clearInterval(tickHandle);
  clearTimeout(idleHandle);
  document.getElementById("timer").style.display = "none";
  document.getElementById("timer").classList.remove("paused");
  document.getElementById("timer-display").textContent = "00:00";
  const a = document.getElementById("timer-alert"); a.style.display = "none"; clearTimeout(a._t);
}
function currentElapsedMs(){ return elapsedMs + (timerRunning ? Date.now()-runStart : 0); }
function updateTimerDisplay(){
  const ms = currentElapsedMs();
  document.getElementById("timer-display").textContent = fmtDuration(ms);
  if(ms >= WARN1_MS && !warned8){
    warned8 = true;
    showTimerAlert("⏰ 已作答 8 分鐘,請把握時間(10 分鐘將自動交卷)");
  }
  if(ms >= LIMIT_MS && !forceSubmitted){
    warned10 = true; forceSubmitted = true;
    showTimerAlert("時間到囉 ⏰ 這次先交卷,把握學到的、下次會更好!");
    forceSubmit();
  }
}
function showTimerAlert(msg){
  const a = document.getElementById("timer-alert");
  a.textContent = msg; a.style.display = "block";
  clearTimeout(a._t);
  a._t = setTimeout(()=>{ a.style.display = "none"; }, 7000);
}
/* 10 分鐘到 → 未填留空、略過補題提醒，直接進檢查頁，且不可再回去編輯 */
function forceSubmit(){
  if(!document.getElementById("screen-quiz").classList.contains("active")) return;
  clearTimeout(idleHandle);
  pauseTimer();
  buildReview();
  showScreen("screen-review");
  document.getElementById("btn-edit").disabled = true;
}
function fmtDuration(ms){
  const s = Math.floor(ms/1000);
  const mm = String(Math.floor(s/60)).padStart(2,"0");
  const ss = String(s%60).padStart(2,"0");
  return mm+":"+ss;
}

/* ==========================================================================
   10) 讀取單題作答 → { filled, display }
   ========================================================================== */
function readAnswer(q){
  if(q.type === "single" || q.type === "multiple"){
    const checked = [...document.querySelectorAll(`input[name="${q.id}"]:checked`)];
    if(checked.length === 0) return { filled:false, display:"" };
    const parts = checked.map(c => `${c.value}. ${c.getAttribute("data-text")}`);
    return { filled:true, display: parts.join(q.type==="multiple" ? "\n" : "") };
  } else {
    const ta = document.querySelector(`textarea[name="${q.id}"]`);
    const v = (ta.value||"").trim();
    return { filled: v.length>0, display: v };
  }
}

/* ==========================================================================
   11) 送出 → 逐題檢查未填（由前往後跳）→ 檢查頁
   ========================================================================== */
document.getElementById("btn-submit").addEventListener("click", ()=>{
  const quiz = QUIZZES[currentMode];
  for(let i=0;i<quiz.questions.length;i++){
    const q = quiz.questions[i];
    if(!readAnswer(q).filled){
      flashQuestion(q.id);
      return; // 一次只跳到最前面未完成的一題
    }
  }
  // 全部完成 → 停止計時、進檢查頁
  clearTimeout(idleHandle);
  pauseTimer();
  buildReview();
  showScreen("screen-review");
});

function flashQuestion(qid){
  const card = document.getElementById("card-"+qid);
  card.scrollIntoView({behavior:"smooth", block:"center"});
  card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash");
  const focusEl = card.querySelector("textarea, input");
  if(focusEl) setTimeout(()=>focusEl.focus(), 300);
}

/* ==========================================================================
   12) 檢查頁（唯讀）
   ========================================================================== */
function buildReview(){
  const quiz = QUIZZES[currentMode];
  const list = document.getElementById("review-list");
  list.innerHTML = "";
  quiz.questions.forEach((q,i)=>{
    const a = readAnswer(q);
    const item = document.createElement("div");

}

let submitting = false;   // 送出中旗標（取代停用按鈕，避免按鈕卡住）
function submitToSheet(){
  if(submitting) return;                       // 送出中：忽略重複點擊
  const status = document.getElementById("submit-status");
  submitting = true;
  status.className = "status";
  status.textContent = "送出中…";

  const quiz = QUIZZES[currentMode];
  const answers = quiz.questions.map(q => readAnswer(q).display);        // 純答案
  const questions = quiz.questions.map((q,i) => `Q${i+1}. ${q.text}`);   // 題目（含 Q 編號）
  const durationText = fmtDuration(currentElapsedMs());
  const dateText = new Date(answerStartISO).toLocaleString("zh-TW",{timeZone:"Asia/Taipei",hour12:false});

  jsonp({
    action: "submit",
    email: currentEmail,
    datetime: dateText,
    duration: durationText,
    mode: quiz.title,
    answers: JSON.stringify(answers),
    questions: JSON.stringify(questions)
  }).then(res=>{
    submitting = false;
    if(res && res.ok){
      document.getElementById("done-summary").textContent =
        `${quiz.title} · 作答耗時 ${durationText}`;
      completedTitles.add(quiz.title);  // 立即標記
      lastSubmit[quiz.title] = res.submitMs || Date.now(); // 立即進入 8 小時冷卻
      renderModeGrid();
      resetTimer();
      showScreen("screen-done");
    } else {
      throw new Error(res && res.error ? res.error : "未知錯誤");
    }
  }).catch(err=>{
    submitting = false;
    status.className = "status err";
    status.textContent = "送出失敗:" + err.message + "(請稍後再試或聯絡管理員)";
  });
}

function loadSubmissions(silent){

function populateModeFilter(){

function populateEmailFilter(){
  const sel = document.getElementById("filter-email");

/* 耗時顯示正規化：把被 Google Sheet 當成時間值(1899-12-30T...)的耗時還原為 mm:ss */
function fmtDurationDisplay(v){
  if(v === null || v === undefined || v === "") return "";
  const s = String(v);
  if(/^\d{1,3}:\d{2}$/.test(s)) return s;                 // 已是 mm:ss
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)){
    const d = new Date(s);
    if(!isNaN(d.getTime())){
      // Sheet 把 "mm:ss" 誤判為 "hh:mm" 存起來 → 時=原分、分=原秒
      return String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0");
    }
  }
  return s;
}

function renderReviewTable(){
  const body = document.getElementById("rev-body");
  const mode = document.getElementById("filter-mode").value;
  const emailF = document.getElementById("filter-email").value;
  const sort = document.getElementById("filter-sort").value;
  const ungraded = document.getElementById("filter-ungraded").checked;

  let items = reviewItems.slice();
  if(mode) items = items.filter(i => i.mode === mode);
  if(emailF) items = items.filter(i => String(i.email) === emailF);
  if(ungraded) items = items.filter(i => i.score === "" || i.score === null || i.score === undefined);
  items.sort((a,b)=> sort === "oldest" ? a.order - b.order : b.order - a.order);

  document.getElementById("rev-count").textContent = `共 ${items.length} 筆`;

  if(items.length === 0){
    body.innerHTML = `<tr><td colspan="7" class="loading">沒有符合條件的紀錄</td></tr>`;
    return;
  }
  body.innerHTML = "";
  items.forEach(it=>{
    const scored = it.score !== "" && it.score !== null && it.score !== undefined;
    const tr = document.createElement("tr");
    const modeCell = escapeHtml(String(it.mode||"")) + (it.peek ? ' <span style="color:var(--warn);font-weight:700;">👀 偷看</span>' : '');
    const actionCell = it.peek
      ? `<button class="btn small danger btn-del" title="刪除並解鎖">🗑</button>`
      : `<button class="btn small btn-grade ${scored?"graded":""}">${scored?"✓ 已批改":"批改"}</button>
         <button class="btn small danger btn-del" title="刪除這筆作答">🗑</button>`;
    tr.innerHTML = `
      <td>${it.order + 1}</td>
      <td>${escapeHtml(String(it.email||""))}</td>
      <td>${escapeHtml(String(it.datetime||""))}</td>
      <td>${modeCell}</td>
      <td>${escapeHtml(fmtDurationDisplay(it.duration))}</td>
      <td>${it.peek ? '<span class="score-pill empty">偷看</span>' : `<span class="score-pill ${scored?"":"empty"}">${scored?escapeHtml(String(it.score)):"未評"}</span>`}</td>
      <td style="white-space:nowrap;">${actionCell}</td>`;
    const gb = tr.querySelector(".btn-grade");
    if(gb) gb.addEventListener("click", ()=>openGrade(it));
    tr.querySelector(".btn-del").addEventListener("click", ()=>deleteSubmission(it, tr));
    body.appendChild(tr);
  });
}

function deleteSubmission(item, tr){
  if(!confirm(`確定刪除這筆作答?（無法復原）\n\n${item.email}\n${item.mode}\n${item.datetime}\n\n總表與模式分頁都會一併移除。`)) return;
  const delBtn = tr.querySelector(".btn-del");
  const gradeBtn = tr.querySelector(".btn-grade");
  // 處理中：該列淡化並顯示「刪除中…」，不動到其他列、不整頁空白
  tr.style.opacity = "0.45";
  delBtn.disabled = true; gradeBtn.disabled = true;
  delBtn.textContent = "刪除中…";

  jsonp({ action:"delete", reviewer: currentEmail, totalRow:item.totalRow, modeRow:item.modeRow, mode:item.mode }).then(res=>{
    if(!res || !res.ok) throw new Error(res && res.error ? res.error : "刪除失敗");
    if(res.deleted === 0){
      // 沒刪到：還原該列
      tr.style.opacity = ""; delBtn.disabled = false; gradeBtn.disabled = false; delBtn.textContent = "🗑";
      alert("找不到對應紀錄,可能已被刪除,請按「↻ 重新整理」。");
      return;
    }
    // 成功：靜默重新載入（表格不會變空白，列號同步更新，該筆自然消失）
    loadSubmissions(true);
  }).catch(err=>{
    tr.style.opacity = ""; delBtn.disabled = false; gradeBtn.disabled = false; delBtn.textContent = "🗑";
    alert("刪除失敗:" + err.message);
  });
}

function openGrade(item){
  currentGradeItem = item;
  const panel = document.getElementById("grade-panel");
  const quiz = Object.values(QUIZZES).find(q => q.title === item.mode);
  const modeName = item.mode || "未知模式";
  const answers = item.answers || [];
  // 以「該模式實際題數」為準；模式未知時才退回用作答數量
  const n = quiz ? quiz.questions.length : answers.length;

  document.getElementById("grade-title").textContent = `「${modeName}」批改`;
  document.getElementById("grade-sub").textContent =
    `學員：${item.email} ・ 第 ${item.order + 1} 筆 ・ 共 ${n} 題`;

  const defaultPts = n > 0 ? Math.round(100 / n) : 0; // 預設平均配分，可自行調整

  const detail = document.getElementById("grade-detail");
  detail.innerHTML = "";
  const refList = answerKeys[item.mode] || [];
  const saved = Array.isArray(item.gradeDetail) ? item.gradeDetail : null; // 先前批改明細
  for(let i=0;i<n;i++){
    const ans = answers[i];
    const qtext = (quiz && quiz.questions[i]) ? quiz.questions[i].text : `第 ${i+1} 題`;
    const refAns = (refList[i] !== undefined && refList[i] !== null) ? String(refList[i]) : "";
    const filled = ans !== "" && ans !== null && ans !== undefined;
    const row = document.createElement("div");
    row.className = "grade-q";
    row.innerHTML = `
      <div class="rv-q">Q${i+1}. ${escapeHtml(String(qtext))}</div>
      <div class="stu-a ${filled?'':'empty'}">${filled ? escapeHtml(String(ans)) : "（未作答）"}</div>
      ${refAns ? `<div class="ref-a"><b>參考答案：</b>${escapeHtml(refAns)}</div>` : ""}
      <div class="grade-controls">
        <div class="mark-toggle">
          <button type="button" class="mark ok">✓ 正確</button>
          <button type="button" class="mark half">◐ 半對</button>
          <button type="button" class="mark no">✗ 錯誤</button>
        </div>
        <label class="pts">配分 <input type="number" class="q-points" min="0" step="1" value="${defaultPts}"> 分</label>
        <label class="pts half-wrap" style="display:none;">得分 <input type="number" class="q-half" min="0" step="1"> 分</label>
      </div>
      <input type="text" class="q-comment" placeholder="批改說明(選填)" />`;

    const okBtn = row.querySelector(".mark.ok");
    const halfBtn = row.querySelector(".mark.half");
    const noBtn = row.querySelector(".mark.no");
    const halfWrap = row.querySelector(".half-wrap");
    const halfInput = row.querySelector(".q-half");
    const ptsInput = row.querySelector(".q-points");
    const commentInput = row.querySelector(".q-comment");

    function setState(state){
      okBtn.classList.toggle("active", state==="ok");
      halfBtn.classList.toggle("active", state==="half");
      noBtn.classList.toggle("active", state==="no");
      halfWrap.style.display = state==="half" ? "inline-flex" : "none";
      if(state==="half" && halfInput.value===""){
        const p = parseFloat(ptsInput.value) || 0;
        halfInput.value = Math.round(p/2);   // 預設一半，可自行調整
      }
      recomputeGradeTotal();
      if(state==="half") halfInput.focus();
    }
    okBtn.addEventListener("click", ()=>setState("ok"));
    halfBtn.addEventListener("click", ()=>setState("half"));
    noBtn.addEventListener("click", ()=>setState("no"));
    halfInput.addEventListener("input", recomputeGradeTotal);
    ptsInput.addEventListener("input", recomputeGradeTotal);

    // 還原先前批改（不觸發 focus）
    if(saved && saved[i]){
      const d = saved[i];
      if(d.points !== undefined && d.points !== "") ptsInput.value = d.points;
      if(d.comment) commentInput.value = d.comment;
      if(d.state === "ok") okBtn.classList.add("active");
      else if(d.state === "no") noBtn.classList.add("active");
      else if(d.state === "half"){
        halfBtn.classList.add("active");
        halfWrap.style.display = "inline-flex";
        halfInput.value = (d.half !== undefined && d.half !== "") ? d.half : Math.round((parseFloat(ptsInput.value)||0)/2);
      }
    }
    detail.appendChild(row);
  }

  recomputeGradeTotal();
  document.getElementById("grade-status").textContent = "";
  document.getElementById("grade-status").className = "status";
  panel.style.display = "block";
  panel.scrollIntoView({behavior:"smooth", block:"start"});
}

// 試卷得分 = 每題實得分加總：✓=配分、半對=輸入分(不超過配分)、✗/未選=0
function recomputeGradeTotal(){
  let total = 0, max = 0;
  document.querySelectorAll("#grade-detail .grade-q").forEach(row=>{
    const pts = parseFloat(row.querySelector(".q-points").value) || 0;
    max += pts;
    if(row.querySelector(".mark.ok").classList.contains("active")){
      total += pts;
    } else if(row.querySelector(".mark.half").classList.contains("active")){
      let h = parseFloat(row.querySelector(".q-half").value) || 0;
      if(h < 0) h = 0;
      if(h > pts) h = pts;   // 半對得分不超過該題配分
      total += h;
    }
    // ✗ 錯誤 / 未選 → 0
  });
  total = Math.round(total * 100) / 100;
  max = Math.round(max * 100) / 100;
  document.getElementById("grade-total").textContent = total;
  document.getElementById("grade-maxnote").textContent = `滿分 ${max} 分`;
}

// 收集目前批改明細（供儲存與截圖）
function collectGradeDetail(){
  const detail = [];
  document.querySelectorAll("#grade-detail .grade-q").forEach(row=>{
    let state = "";
    if(row.querySelector(".mark.ok").classList.contains("active")) state = "ok";
    else if(row.querySelector(".mark.half").classList.contains("active")) state = "half";
    else if(row.querySelector(".mark.no").classList.contains("active")) state = "no";
    detail.push({
      state: state,
      points: parseFloat(row.querySelector(".q-points").value) || 0,
      half: row.querySelector(".q-half").value,
      comment: row.querySelector(".q-comment").value
    });
  });
  return detail;
}

/* ===== 一鍵複製批改截圖 ===== */
function loadHtml2Canvas(){
  return new Promise((resolve, reject)=>{
    if(window.html2canvas) return resolve();
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error("無法載入截圖元件(請檢查網路)"));
    document.head.appendChild(s);
  });
}

document.getElementById("btn-grade-shot").addEventListener("click", captureGradeShot);

async function captureGradeShot(){
  const status = document.getElementById("grade-status");
  const btn = document.getElementById("btn-grade-shot");
  status.className="status"; status.textContent="產生截圖中…";
  btn.disabled = true;
  try{
    await loadHtml2Canvas();
    // 把 input 目前的值同步到 attribute，截圖才顯示得出來
    document.querySelectorAll("#grade-capture input").forEach(inp=>{ inp.setAttribute("value", inp.value); });
    const target = document.getElementById("grade-capture");
    const canvas = await html2canvas(target, { backgroundColor:"#0f1524", scale:2, useCORS:true });
    canvas.toBlob(async (blob)=>{
      if(!blob){ status.className="status err"; status.textContent="截圖失敗"; btn.disabled=false; return; }
      try{
        await navigator.clipboard.write([ new ClipboardItem({ "image/png": blob }) ]);
        status.className="status ok"; status.textContent="✓ 已複製批改截圖到剪貼簿,可直接貼上";
      }catch(err){
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `批改_${(currentGradeItem&&currentGradeItem.email)||"screenshot"}.png`;
        a.click();
        URL.revokeObjectURL(url);
        status.className="status ok"; status.textContent="✓ 已下載截圖(此瀏覽器不支援直接複製圖片)";
      }
      btn.disabled=false;
    }, "image/png");
  }catch(err){
    status.className="status err"; status.textContent="截圖失敗:"+err.message;
    btn.disabled=false;
  }
}

/* ==========================================================================
   15) JSONP 工具
   ========================================================================== */
function jsonp(params){
  return new Promise((resolve, reject)=>{
    const cb = "cb_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const timer = setTimeout(()=>{ cleanup(); reject(new Error("連線逾時")); }, 20000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = (data)=>{ cleanup(); resolve(data); };
    const qs = Object.entries(params)
      .map(([k,v]) => encodeURIComponent(k)+"="+encodeURIComponent(v)).join("&");
    s.src = GAS_URL + "?" + qs + "&callback=" + cb;
    s.onerror = ()=>{ cleanup(); reject(new Error("網路連線失敗")); };
    document.body.appendChild(s);
  });
}

/* ==========================================================================
   16) 小工具
   ========================================================================== */
function escapeHtml(str){
  return String(str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
